name: CI Reusable Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
    # secrets:
    #   SONAR_TOKEN:
    #     required: false
    #   GITHUB_TOKEN:
    #     required: false
    outputs:
      testing-result:
        description: 'Result of testing stage'
        value: ${{ jobs.testing.result }}
      quality-result:
        description: 'Result of quality stage'
        value: ${{ jobs.quality.result }}

jobs:
  testing:
    name: Testing Stage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["${{ inputs.python-version }}"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          ruff check app/

      - name: Run formatting check
        run: |
          ruff format --check app/

      - name: Run tests
        run: |
          python -m pytest app/test/ -v

